name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run unit tests, lint and build unsigned APK
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug --stacktrace --no-daemon

      - name: Collect unsigned APK and apksigner
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/debug/*.apk artifacts/
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner.jar | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          cp "$APKSIGNER" artifacts/apksigner.jar

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xinqing2-unsigned-apk
          path: artifacts/
          retention-days: 7
