name: Android CI

on:
  push:
    branches: [master, main]
    paths: ['client/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Diagnostics
        run: |
          chmod +x ./gradlew
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ./gradlew --version

      - name: Shared JVM tests
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest -PuseMirror=false --stacktrace --no-daemon --console=plain 2>&1 | tee shared-test.log

      - name: Build development APK for fixed-key re-signing
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug -PuseMirror=false --stacktrace --no-daemon --console=plain 2>&1 | tee apk.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :androidApp:lintDebug -PuseMirror=false --stacktrace --no-daemon --console=plain 2>&1 | tee lint.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-diagnostics
          path: |
            client/shared-test.log
            client/apk.log
            client/lint.log
            client/shared/build/reports/tests/**
            client/shared/build/test-results/**
            client/androidApp/build/reports/**
            client/androidApp/build/outputs/logs/**
            client/shared/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Collect development APKs and apksigner
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/debug/*.apk artifacts/
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner.jar | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          cp "$APKSIGNER" artifacts/apksigner.jar

      - name: Upload APKs requiring fixed-key re-signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xinqing2-ci-apk
          path: client/artifacts/
          retention-days: 7
