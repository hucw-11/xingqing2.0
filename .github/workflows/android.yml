name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Diagnostics
        run: |
          chmod +x ./gradlew
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ./gradlew --version

      - name: Shared JVM tests
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest --stacktrace --no-daemon --console=plain 2>&1 | tee shared-test.log

      - name: Build unsigned debug APK
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee apk.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :androidApp:lintDebug --stacktrace --no-daemon --console=plain 2>&1 | tee lint.log

      - name: Publish failure logs
        if: failure()
        run: |
          {
            echo "## Android CI failure"
            for f in shared-test.log apk.log lint.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```text'
                tail -n 200 "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect unsigned APK and apksigner
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/debug/*.apk artifacts/
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner.jar | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          cp "$APKSIGNER" artifacts/apksigner.jar

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xinqing2-unsigned-apk
          path: artifacts/
          retention-days: 7
